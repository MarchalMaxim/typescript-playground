<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TypeScript Playground</h1>
            <p class="subtitle">Write and test TypeScript code in your browser</p>
        </header>
        
        <div class="playground">
            <div class="editor-panel">
                <div class="panel-header">
                    <h2>TypeScript Code</h2>
                    <button id="runBtn" class="run-button">▶ Run Code</button>
                </div>
                <div class="editor-container">
                    <textarea id="editor" spellcheck="false"></textarea>
                </div>
            </div>
            
            <div class="output-panel">
                <div class="panel-header">
                    <h2>Output</h2>
                    <button id="clearBtn" class="clear-button">Clear</button>
                </div>
                <div id="output" class="output-container"></div>
                
                <div class="panel-header">
                    <h2>Compiled JavaScript</h2>
                </div>
                <div id="compiled" class="compiled-container"></div>
            </div>
        </div>
    </div>

    <script src="lib/typescript.js"></script>
    <script src="app.js"></script>
</body>
</html>
